name: Build TrollRestore macOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: brew install python-tk 2>/dev/null || true

      - name: Try pip install PyQt5
        run: |
          pip install PyQt5 2>&1 | tail -5
          python3 -c "from PyQt5.QtWidgets import QApplication; print('PyQt5 works!')"

      - name: Install other deps
        run: pip install qasync pymobiledevice3 packaging requests pyinstaller

      - name: Build
        run: |
          pyinstaller --onedir --windowed \
            --name "TrollRestore" \
            --add-data "sparserestore:sparserestore" \
            --add-data "PersistenceHelper_Embedded:." \
            --hidden-import PyQt5.QtCore \
            --hidden-import PyQt5.QtGui \
            --hidden-import PyQt5.QtWidgets \
            trollrestore_mac.py 2>&1
          ls -la dist/ 2>/dev/null || echo "No dist/ found"
          ls -la dist/TrollRestore.app/Contents/MacOS/ 2>/dev/null || echo "No app found"

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrollRestore-macOS
          path: dist/TrollRestore.app
