name: Build TrollRestore macOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PyQt5 qasync pymobiledevice3 packaging requests py2app

      - name: Build with py2app
        run: |
          python3 -c "
import sys
sys.argv = ['py2applet', '--make-setup', 'trollrestore_mac.py']
exec(open('$(which py2applet)').read())
" 2>/dev/null || true

          cat > setup.py << 'SETUPEOF'
from setuptools import setup

APP = ['trollrestore_mac.py']
DATA_FILES = [
    ('sparserestore', ['sparserestore/__init__.py', 'sparserestore/backup.py', 'sparserestore/mbdb.py']),
    ('', ['PersistenceHelper_Embedded']),
]
OPTIONS = {
    'argv_emulation': False,
    'packages': ['PyQt5', 'qasync', 'pymobiledevice3', 'packaging', 'requests'],
    'includes': ['sip', 'PyQt5.QtCore', 'PyQt5.QtGui', 'PyQt5.QtWidgets'],
    'plist': {
        'CFBundleName': 'TrollRestore',
        'CFBundleDisplayName': '巨魔安装器',
        'CFBundleIdentifier': 'com.trollrestore.app',
        'CFBundleVersion': '1.0.0',
        'CFBundleShortVersionString': '1.0.0',
    }
}

setup(
    name='TrollRestore',
    app=APP,
    data_files=DATA_FILES,
    options={'py2app': OPTIONS},
    setup_requires=['py2app'],
)
SETUPEOF

          python3 setup.py py2app 2>&1
          ls -la dist/

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: TrollRestore-macOS
          path: dist/TrollRestore.app
