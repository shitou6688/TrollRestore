name: Build TrollRestore macOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.10'
          auto-activate-base: false

      - name: Install dependencies via conda
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge pyqt
          pip install qasync pymobiledevice3 packaging requests pyinstaller

      - name: Build with PyInstaller
        shell: bash -el {0}
        run: |
          pyinstaller --onedir --windowed \
            --name "TrollRestore" \
            --add-data "sparserestore:sparserestore" \
            --add-data "PersistenceHelper_Embedded:." \
            --hidden-import "PyQt5.QtCore" \
            --hidden-import "PyQt5.QtGui" \
            --hidden-import "PyQt5.QtWidgets" \
            trollrestore_mac.py
          ls -la dist/

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: TrollRestore-macOS
          path: dist/TrollRestore.app
