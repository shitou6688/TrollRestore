name: Build TrollRestore macOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install PyQt5 qasync pymobiledevice3 packaging requests pyinstaller

      - name: Build
        run: |
          pyinstaller --onedir --windowed \
            --name "TrollRestore" \
            --add-data "sparserestore:sparserestore" \
            --collect-all PyQt5 \
            trollrestore_mac.py
          # PersistenceHelper_Embedded is iOS binary, cannot be codesigned on macOS
          cp PersistenceHelper_Embedded dist/TrollRestore.app/Contents/MacOS/
          ls -la dist/TrollRestore.app/Contents/MacOS/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TrollRestore-macOS
          path: dist/TrollRestore.app
