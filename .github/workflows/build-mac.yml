name: Test PyQt5 macOS

on: workflow_dispatch

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install PyQt5 2>&1
      - run: python3 -c "from PyQt5.QtWidgets import QApplication; print('OK')"
