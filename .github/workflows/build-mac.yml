name: Build TrollRestore macOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PyQt5 qasync pymobiledevice3 packaging requests pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onedir --windowed \
            --name "TrollRestore" \
            --add-data "sparserestore:sparserestore" \
            --add-data "PersistenceHelper_Embedded:." \
            trollrestore_mac.py 2>&1
          ls -la dist/

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: TrollRestore-macOS
          path: dist/TrollRestore.app
