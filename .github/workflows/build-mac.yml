name: Build TrollRestore macOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install PyQt5 qasync pymobiledevice3 packaging requests pyinstaller

      - name: Build
        run: |
          pyinstaller --onedir --windowed \
            --name "TrollRestore" \
            --add-data "sparserestore:sparserestore" \
            --hidden-import PyQt5.QtCore \
            --hidden-import PyQt5.QtGui \
            --hidden-import PyQt5.QtWidgets \
            --exclude-module PyQt5.QtSql \
            --exclude-module PyQt5.QtNetwork \
            --exclude-module PyQt5.QtPrintSupport \
            --exclude-module PyQt5.QtTest \
            --exclude-module PyQt5.QtXml \
            --exclude-module PyQt5.QtSvg \
            --exclude-module PyQt5.QtBluetooth \
            --exclude-module PyQt5.QtDBus \
            --exclude-module PyQt5.QtHelp \
            --exclude-module PyQt5.QtLocation \
            --exclude-module PyQt5.QtMultimedia \
            --exclude-module PyQt5.QtMultimediaWidgets \
            --exclude-module PyQt5.QtNfc \
            --exclude-module PyQt5.QtOpenGL \
            --exclude-module PyQt5.QtPositioning \
            --exclude-module PyQt5.QtQml \
            --exclude-module PyQt5.QtQuick \
            --exclude-module PyQt5.QtSensors \
            --exclude-module PyQt5.QtSerialPort \
            --exclude-module PyQt5.QtWebChannel \
            --exclude-module PyQt5.QtWebEngine \
            --exclude-module PyQt5.QtWebEngineCore \
            --exclude-module PyQt5.QtWebEngineWidgets \
            --exclude-module PyQt5.QtWebSockets \
            --exclude-module PyQt5.QtXmlPatterns \
            trollrestore_mac.py
          # iOS binary cannot be codesigned, copy manually
          cp PersistenceHelper_Embedded dist/TrollRestore.app/Contents/MacOS/
          echo "✅ Build complete"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TrollRestore-macOS
          path: dist/TrollRestore.app
