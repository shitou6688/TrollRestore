name: Build TrollRestore macOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PyQt5 qasync pymobiledevice3 packaging requests py2app

      - name: Verify setup
        run: |
          python3 -c "import PyQt5; print('PyQt5 OK')"
          python3 -c "import qasync; print('qasync OK')"
          python3 -c "from sparserestore import backup; print('sparserestore OK')"
          ls -la PersistenceHelper_Embedded
          echo "All checks passed"

      - name: Create setup.py
        run: |
          cat > setup.py << 'EOF'
from setuptools import setup

APP = ['trollrestore_mac.py']
DATA_FILES = []
OPTIONS = {
    'argv_emulation': False,
    'packages': ['PyQt5', 'qasync'],
    'plist': {
        'CFBundleName': 'TrollRestore',
        'CFBundleDisplayName': '巨魔安装器',
        'CFBundleIdentifier': 'com.trollrestore.app',
        'CFBundleVersion': '1.0',
        'CFBundleShortVersionString': '1.0',
    }
}

setup(
    name='TrollRestore',
    app=APP,
    data_files=DATA_FILES,
    options={'py2app': OPTIONS},
    setup_requires=['py2app'],
)
EOF
          echo "setup.py created:"
          cat setup.py

      - name: Build with py2app
        run: |
          python3 setup.py py2app 2>&1
          echo "Build exit code: $?"
          ls -la dist/

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrollRestore-macOS
          path: dist/TrollRestore.app
